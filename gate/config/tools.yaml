# MOADIX gate-run tools (increment 5; DESIGN.md §6 "Deterministic tools are run by the gate").
# Installed root-owned with the gate. Every tool is pinned to an exact version, and every
# download is checked against a sha256 taken from the upstream release's own checksum file
# (or an npm/PyPI lockfile with integrity hashes). Pins are the newest release at least
# 14 days old on 2026-11-11.
#
# The gate runs tools ONLY from <MOADIX_HOME>/tools (root-owned, written by
# managed/install.sh through managed/fetch_tools.py), never from PATH: a session or project
# setting could change PATH. The agent may run its own copies for feedback; only the
# gate's run counts.
#
#   kind      binary   a single executable file
#             archive  a .tar.gz/.zip holding `bin`
#             npm      tools/npm/<name>/package-lock.json, installed with npm ci --ignore-scripts
#             pypi     tools/py/<name>/requirements.txt (hash-locked), installed with uv
#   assets    per platform (darwin-arm64, darwin-x64, linux-x64, linux-arm64): url + sha256
#   network   hosts the tool contacts when the AGENT runs it for feedback (managed sandbox
#             allowlist). The gate's own run is offline where the tool allows it.
version: 1
tools:
