  - name: zap
    version: 2.17.0
    image: ghcr.io/zaproxy/zaproxy
    tag: 20261026-stable
    # OCI image index digest (multi-arch: linux/amd64, linux/arm64; no darwin images).
    digest: sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238
    bin: zap-baseline.py
    network: []
    # `stable` and `2.17.0` tags are mutable: on 2026-11-14 both point to
    # sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af, built
    # 2026-11-03 (11 days old). 20261026-stable (built 2026-10-26) is the newest dated stable
    # build that is at least 14 days old. ZAP version inside it was not read from the image.
    # The image bundles Debian packages, OpenJDK, firefox-esr etc. whose licences were not scanned.
# Product dependencies (Amendment 3 section 4): the PRODUCT installs these; MOADIX pins the version it
# expects and has read each LICENSE. Not fetched by MOADIX. axe-core and @axe-core/playwright are
