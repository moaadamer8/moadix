# MOADIX confined runner (increments 7c/7d; docs/confinement-design.md, approved with rulings).
# Installed root-owned with the gate. Read by gate/confined.py.
#
#   tiers.<name>   default limits (section 3.5). A product may raise any of them to at most
#                  max_factor x the default through ADOPT of product-tools.yaml `limits:`.
#   images         base and service images, pinned by digest, each with its official source and the
#                  licences found in it (THIRD-PARTY.md). `status: blocked` keeps an image from being
#                  used: every gate that needs it reports UNKNOWN with the reason. `status: cleared`
#                  lets the runner use it. Ruling 1 on increment 7d: an image pulled unmodified by digest
#                  and never vendored is accepted under any licence that permits use without
#                  restriction; documentation, icon and data licences do not stop. All six cleared
#                  (2026-11-15); inventory in THIRD-PARTY.md.
#   user           an image that must run as its own user (ZAP runs as uid 1000; it executes no product code)
version: 1
max_factor: 2
# 0.7.3 (task-tracker MF-27): the run's uid is `nobody` (65534:65534), which has a passwd entry in every
# pinned image (Debian 12/13, Ubuntu 24.04). 10001 had none, so a tool asking for its user (Node's
# os.userInfo, used by LikeC4) crashed. Still non-root, no capabilities, read-only root, no host mounts;
# no image is modified. confined.Run checks the entry exists before a run and reports UNKNOWN otherwise.
uid: 65534
tiers:
  E-lint:
    cpus: 2
    memory_mb: 2048
    pids: 256
    tmp_mb: 512
    out_mb: 50
    wall_s: 300
  E-test:
    cpus: 2
    memory_mb: 4096
    pids: 512
    tmp_mb: 1024
    out_mb: 200
    wall_s: 900
  E-mutation:
    cpus: 4
    memory_mb: 8192
    pids: 1024
    tmp_mb: 2048
    out_mb: 200
    wall_s: 3600
  L:
    cpus: 2
    memory_mb: 2048
    pids: 512
    tmp_mb: 1024
    out_mb: 200
    wall_s: 1800
  build:
    cpus: 2
    memory_mb: 4096
    pids: 512
    tmp_mb: 2048
    out_mb: 50
    wall_s: 900
  install:
    cpus: 2
    memory_mb: 4096
    pids: 512
    tmp_mb: 2048
    out_mb: 2048
    wall_s: 900
images:
  node:
    ref: "docker.io/library/node:24-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54"
    source: "https://hub.docker.com/_/node (Docker Official Image, Debian 12 base)"
    status: cleared
  node-full:
    ref: "docker.io/library/node:24-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496"
    source: "https://hub.docker.com/_/node (Docker Official Image, Debian 12; Stryker's command runner needs ps)"
    status: cleared
  python:
    ref: "docker.io/library/python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b"
    source: "https://hub.docker.com/_/python (Docker Official Image, Debian 13 base)"
    status: cleared
  chromium:
    ref: "mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f"
    source: "https://mcr.microsoft.com/en-us/artifact/mar/playwright (Microsoft, Ubuntu 24.04 base, Chromium/Firefox/WebKit 1.64.1)"
    status: cleared
  zap:
    ref: "ghcr.io/zaproxy/zaproxy:20261026-stable@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238"
    source: "https://github.com/zaproxy/zaproxy/pkgs/container/zaproxy (ZAP project, Debian 12 base, ZAP 2.17.0)"
    user: "1000:1000"
    status: cleared
  postgres:
    ref: "docker.io/library/postgres:17-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536"
    source: "https://hub.docker.com/_/postgres (Docker Official Image, Debian 12 base, PostgreSQL 17)"
    status: cleared
services:
  postgres:
    image: postgres
    port: 5432
    alias: postgres.moadix.test
    env_url: DATABASE_URL
    user: "999:999"
    data: /var/lib/postgresql/data
    tmpfs: [/var/run/postgresql]
    # 0.7.5: the runner's fixed PATH replaces the image's own, and the image's entrypoint finds initdb and
    # postgres on PATH (they are in /usr/lib/postgresql/17/bin, which the image's own PATH adds)
    path: /usr/lib/postgresql/17/bin:/usr/local/bin:/usr/bin:/bin
    env:
      POSTGRES_USER: moadix
      POSTGRES_DB: test
      POSTGRES_HOST_AUTH_METHOD: trust   # reachable only from the run's internal network, removed after the run
