# MOADIX verifier roles (increment 4; DESIGN.md §5 fresh-context verification).
# Installed root-owned with the gate. Read by gate/verify.py.
#
#   phase     the phase label whose APPROVE needs this verifier's evidence
#   agent     the plugin agent (agents/<name>.md), launched as moadix:<agent>
#   method    the vendored skill the verifier loads (moadix:<method>); its only Skill
#   scope     globs (repo-relative) of the files this role reviews. The changed files in
#             the diff range that match are the brief's "required evidence paths": the
#             evidence must list each one under "reviewed".
#   when      always  - scheduled in its phase
#             changed - scheduled only when the diff range changes a file in scope
#   coverage  true: the evidence must map every acceptance criterion in scope to tests
#   failing_severities  findings at these severities make the evidence fail. The verifier
#             reports findings only; the gate, not the verifier, decides what fails.
version: 1
failing_severities: [critical, high]
roles:
  - agent: design-reviewer
    phase: "6"
    method: impeccable
    when: always
    scope: ["sdlc/06-*.md", "design/**"]
  - agent: code-reviewer
    phase: "7"
    method: code-review
    when: always
    scope:
      - "src/**"
      - "public/**"
      - "mobile/**"
      - "scripts/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - "tsconfig.json"
      - "Dockerfile"
      - "docker-compose.yml"
      - "compose/**"
      - ".github/workflows/**"
  - agent: typescript-reviewer
    phase: "7"
    method: typescript-reviewer
    when: changed
    scope: ["**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs"]
  - agent: ac-coverage-critic
    phase: "8"
    method: pr-test-analyzer
    when: always
    coverage: true
    scope: ["tests/**", "ui-tests/**", "e2e/**", "src/**/*.test.*", "src/**/*.spec.*"]
# increment 5: the phase-10a live verifier. No method skill; it drives the running app
# through MOADIX's pinned Playwright MCP (plugin.json: mcp__plugin_moadix_playwright__*),
# with its network-reading tools withheld (gate/verify.py WITHHELD). The brief lists every
# acceptance criterion and every button (found in `buttons` globs at HEAD); the evidence
# maps each to artifacts (trace, video) the browser saved into the evidence directory.
  - agent: live-verifier
    phase: "10a"
    method: null
    live: true
    when: always
    coverage: true
    scope: []
    buttons:
      - "index.html"
      - "public/**/*.html"
      - "src/**/*.html"
      - "src/**/*.jsx"
      - "src/**/*.tsx"
      - "src/**/*.vue"
      - "src/**/*.svelte"
      - "src/**/*.astro"
# increment 6 (ruling 1): triage of Claude Security findings the plugin could not confirm.
# Scheduled in phase 9 only while the gate's scan result for HEAD holds unconfirmed findings
# (when: unconfirmed). The brief lists each one; the evidence's `triage` entries assess each
# as confirmed or rejected, citing path:line at HEAD. check_claude_security applies them: a
# rejected finding stops blocking, a confirmed one is judged by its severity (critical and
# high stay unwaivable). The required paths are the files the findings point at.
  - agent: sf-triager
    phase: "9"
    method: null
    triage: true
    when: unconfirmed
    scope: []
