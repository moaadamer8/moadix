# MOADIX phase manifest (increment 3; DESIGN.md §6). Installed root-owned with the gate.
# The PreToolUse hook denies, in a MOADIX product, any Skill/SlashCommand call or MCP tool
# call that is not listed for the CURRENT phase, and names the phase in the reason.
#   skills    vendored skills under skills/, invoked as moadix:<name> (bare or other
#             plugins' names are refused: only MOADIX's stripped copies are allowed)
#   mcp       MCP server names; a tool mcp__<server>__<tool> (or a plugin's
#             mcp__plugin_<plugin>_<server>__<tool>) is allowed when <server> is listed
#   gate_run  deterministic tools the GATE runs (increment 5): each names its pinned tool
#             (gate/config/tools.yaml) and the validator that runs it. The agent may run
#             its own copy for feedback only; only the gate's run counts.
#   external_skills  another plugin's skill, by full name, that the AGENT may invoke in
#             this phase for feedback (its output never counts; e.g. claude-security in 9,
#             whose counted scan the gate schedules itself).
#   mcp       `moadix:<name>` matches only the server MOADIX's plugin ships
#             (mcp__plugin_moadix_<name>__*, its command pinned in plugin.json).
#   during    phase 12 (Retro) is not a gated phase: its skills apply while the current
#             phase is 11 (sdlc/12-*.md is in phase 11's path map) and after all are done.
# Sizes: skill_md_bytes is what loading the skill puts in context; total_bytes is the
# whole directory. tests/skills/run.py checks them against the files.
version: 1
always:
  skills:
    - request-review
phases:
  - label: "0"
    name: BRD
    skills:
      - bmad-forge-idea
    mcp: []
    gate_run: []
  - label: "1"
    name: Research
    skills:
      - bmad-deep-recon
    mcp:
      - context7
    gate_run: []
  - label: "2"
    name: PRD
    skills:
      - bmad-prd
    mcp: []
    gate_run: []
  - label: "3"
    name: HLD
    skills:
      - bmad-architecture
    mcp: []
    gate_run: []
  - label: "4"
    name: Threat Model
    skills:
      - threat-model
      - threat-mitigation-mapping
    mcp: []
    gate_run: []
  - label: "5"
    name: LLD
    skills: []
    mcp: []
    gate_run:
      - tool: redocly
        purpose: "OpenAPI and Arazzo lint of the LLD contracts; any error fails"
        validator: check-contracts
  - label: "6"
    name: UX
    skills:
      - ui-ux-pro-max
      - impeccable
      - apple-design
    mcp: []
    gate_run: []
    templates:
      - templates/DESIGN.md
  - label: "6b"
    name: Provisioning
    skills: []
    mcp: []
    gate_run:
      - tool: dotenvx
        purpose: "every required key present, every value encrypted (values never read)"
        validator: check-env
  - label: "7"
    name: Tasks and Implementation
    skills:
      - code-review
      - diagnosing-bugs
      - test-driven-development
      - verification-before-completion
      - typescript-reviewer
    mcp: []
    gate_run: []
  - label: "8"
    name: Testing
    skills:
      - pr-test-analyzer
      - javascript-testing-expert
    mcp: []
    gate_run: []
  - label: "9"
    name: Security Verification
    skills: []
    external_skills:
      - "claude-security:claude-security"
    mcp: []
    gate_run:
      - tool: gitleaks
        purpose: "secret scan, history and tree"
        validator: check-gitleaks
      - tool: osv-scanner
        purpose: "dependency vulnerabilities in lockfiles"
        validator: check-osv
      - tool: trivy
        purpose: "filesystem scan, plus declared images"
        validator: check-trivy
      - tool: semgrep
        purpose: "static analysis, local rules only, no account"
        validator: check-semgrep
      - tool: claude-security
        purpose: "finding source (SARIF -> SF-n register), scheduled by the gate on request-review"
        validator: check-claude-security
  - label: "10a"
    name: Live Verification
    skills: []
    mcp:
      - "moadix:playwright"
    gate_run:
      - tool: playwright-mcp
        purpose: "the live verifier's browser (network-reading tools withheld)"
        validator: check-verifiers-10a
      - tool: live-probe
        purpose: "v1's reachability probe of the enumerated surface, loopback only"
        validator: check-surface-live
      - tool: redocly
        purpose: "Arazzo workflows run against the local instance (contract tests)"
        validator: check-live-contracts
  - label: "10b"
    name: Regression Suites
    skills: []
    mcp: []
    gate_run: []
  - label: "10c"
    name: Concurrency and Load
    skills: []
    mcp: []
    gate_run:
      - tool: k6
        purpose: "load thresholds as JUnit cases, plus the product's SQL invariant check"
        validator: check-load
  - label: "11"
    name: Release
    skills: []
    mcp:
      - "moadix:github"
    gate_run:
      - tool: release-please
        purpose: "release PR config; the release commit came from a release PR a human merged"
        validator: check-release
      - tool: github-mcp-server
        purpose: "the gate reads CI results and code-scanning alerts, --read-only"
        validator: check-release
  - label: "11b"
    name: Store Release
    skills: []
    mcp: []
    gate_run: []
  - label: "12"
    name: Retro
    during: ["11", "done"]
    skills:
      - phase-retrospective
      - reflect-queue
    mcp: []
    gate_run: []
