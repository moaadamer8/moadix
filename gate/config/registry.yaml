      - sdlc/05-lld/**
  - id: build-scorecard
    kind: validator
    phase: 11
    status: active
    module: build_scorecard
    verifies:
      - sdlc/02-*.md
      - sdlc/04-*.md
      - sdlc/09-*.md
      - sdlc/10a-*.md
      - sdlc/10b-*.md
      - sdlc/10c-*.md
