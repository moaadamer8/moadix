# MOADIX v2 validator registry. Generated once from sdlc-harness v1 harness/registry.yaml
# (validators with a phase only; `entrypoint: harness/bin/X.sh` became `module: X`).
# Root-owned when installed. Read by gate/validate.py and the ported scorecard.
version: 2
components:
  - id: check-surface-coverage
    kind: validator
    phase: 9
    status: active
    module: check_surface_coverage
  - id: check-authz-matrix
    kind: validator
    phase: 10a
    status: active
    module: check_authz_matrix
  - id: lighthouse-performance-trace
    kind: validator
    phase: 10a
    status: planned
    module: check_live_verification
  - id: check-approvals
    kind: validator
    phase: 11
    status: active
    module: check_approvals
  - id: check-handoff-0
    kind: validator
    phase: 0
    status: active
    module: check_handoff
    args:
      - --phase
      - 0
    verifies:
      - sdlc/00-*.md
  - id: check-handoff-1
    kind: validator
    phase: 1
    status: active
    module: check_handoff
    args:
      - --phase
      - 1
    verifies:
      - sdlc/00-*.md
      - sdlc/01-*.md
      - sdlc/decisions/**
  - id: check-handoff-2
    kind: validator
    phase: 2
    status: active
    module: check_handoff
    args:
      - --phase
      - 2
    verifies:
      - sdlc/00-*.md
      - sdlc/01-*.md
      - sdlc/02-*.md
  - id: check-profile-3
    kind: validator
    phase: 3
    status: active
    module: check_profile
    args:
      - --phase
      - 3
    verifies:
      - sdlc/00-*.md
      - sdlc/03-*.md
  - id: check-profile-5
    kind: validator
    phase: 5
    status: active
    module: check_profile
    args:
      - --phase
      - 5
    verifies:
      - sdlc/02-*.md
      - sdlc/05-lld/**
  - id: build-scorecard
    kind: validator
    phase: 11
    status: active
    module: build_scorecard
    verifies:
      - sdlc/02-*.md
      - sdlc/04-*.md
      - sdlc/09-*.md
      - sdlc/10a-*.md
      - sdlc/10b-*.md
      - sdlc/10c-*.md
      - test-results/**
      - evidence/**
      - src/**
      - mobile/**
  - id: check-store-readiness
    kind: validator
    phase: 11b
    status: active
    module: check_store_readiness
    verifies:
      - sdlc/11-*.md
      - sdlc/11b-*.md
      - release/store/**
      - release/assets/**
      - mobile/**
  - id: check-regression-mobile
    kind: validator
    phase: 10b
    status: active
    module: check_regression_mobile
    verifies:
      - sdlc/10a-*.md
      - e2e-mobile/**
      - .maestro/**
      - mobile/**
  - id: check-live-verification-mobile
    kind: validator
    phase: 10a
    status: active
    module: check_live_verification_mobile
    verifies:
      - sdlc/02-*.md
      - mobile/**
      - evidence/live-mobile/**
  - id: check-regression
    kind: validator
    phase: 10b
    status: active
    module: check_regression
    verifies:
      - sdlc/10a-*.md
      - e2e/**
      - src/**
      - public/**
  - id: check-live-verification
    kind: validator
    phase: 10a
    status: active
    module: check_live_verification
    verifies:
      - sdlc/02-*.md
      - src/**
      - public/**
      - evidence/live/**
  - id: check-concurrency
    kind: validator
    phase: 10c
    status: active
    module: check_concurrency
    verifies:
      - sdlc/04-*.md
      - src/**
      - mobile/**
      - load/**
      - evidence/concurrency/**
  - id: check-provisioning
    kind: validator
    phase: 6b
    status: active
    module: check_provisioning
    verifies:
      - sdlc/02-*.md
      - sdlc/05-lld/**
      - .env.example
  - id: check-security
    kind: validator
    phase: 9
    status: active
    module: check_security
    verifies:
      - sdlc/04-*.md
      - sdlc/05-lld/**
      - src/**
      - mobile/**
      - security/**
  - id: check-traceability
    kind: validator
    phase: 8
    status: active
    module: check_traceability
    verifies:
      - sdlc/02-*.md
      - sdlc/07-*.md
      - tests/**
      - test-results/**
      - src/**
      - mobile/**
  - id: check-lld
    kind: validator
    phase: 5
    status: active
    module: check_lld
    verifies:
      - sdlc/02-*.md
      - sdlc/04-*.md
      - sdlc/05-lld/**
  - id: check-threat-model
    kind: validator
    phase: 4
    status: active
    module: check_threat_model
    verifies:
      - sdlc/03-*.md
      - sdlc/04-*.md
# increment 4: fresh-context verifier evidence (gate/verify.py, gate/config/verifiers.yaml)
  - id: check-verifiers-6
    scope: both
    kind: validator
    phase: 6
    status: active
    module: check_verifiers
    args:
      - --phase
      - 6
  - id: check-verifiers-7
    scope: both
    kind: validator
    phase: 7
    status: active
    module: check_verifiers
    args:
      - --phase
      - 7
  - id: check-verifiers-8
    scope: both
    kind: validator
    phase: 8
    status: active
    module: check_verifiers
    args:
      - --phase
      - 8
# increment 5: gate-run deterministic tools (gate/config/tools.yaml, gate/v1/toolrun.py),
# Claude Security as the phase-9 finding source, the live verifier and v1's live probe.
# timeout: seconds the worker allows this validator (default 180).
  - id: check-contracts
    scope: both
    kind: validator
    phase: 5
    status: active
    module: check_contracts
    timeout: 600
    verifies:
      - sdlc/05-lld/**
  - id: check-env
    scope: both
    kind: validator
    phase: 6b
    status: active
    module: check_env
    verifies:
      - .env.example
      - .env.*
  - id: check-gitleaks
    scope: both
    kind: validator
    phase: 9
    status: active
    module: check_scanners
    args:
      - --tool
      - gitleaks
    timeout: 900
  - id: check-osv
    scope: both
    kind: validator
    phase: 9
    status: active
    module: check_scanners
    args:
      - --tool
      - osv-scanner
    timeout: 900
  - id: check-trivy
    scope: both
    kind: validator
    phase: 9
    status: active
    module: check_scanners
    args:
      - --tool
      - trivy
    timeout: 1800
  - id: check-semgrep
    scope: both
    kind: validator
    phase: 9
    status: active
    module: check_scanners
    args:
      - --tool
      - semgrep
    timeout: 900
  - id: check-claude-security
    scope: both
    kind: validator
    phase: 9
    status: active
    module: check_claude_security
  - id: check-verifiers-10a
    scope: both
    kind: validator
    phase: 10a
    status: active
    module: check_verifiers
    args:
      - --phase
      - 10a
  - id: check-surface-live
    scope: both
    kind: validator
    phase: 10a
    status: active
    module: check_surface_coverage
    args:
      - --live
  - id: check-live-contracts
    scope: both
    kind: validator
    phase: 10a
    status: active
    module: check_live_contracts
    timeout: 900
  - id: check-load
    scope: both
    kind: validator
    phase: 10c
    status: active
    module: check_load
    timeout: 2400
  - id: check-release
    scope: both
    kind: validator
    phase: 11
    status: active
    module: check_release
    timeout: 300
# increment 6 (Amendment 2): feature cycles. `scope` says which phase table a validator
# serves: product (default; it reads the product's own sdlc/ documents), feature (it checks a
# feature's additions in sdlc/features/<id>/) or both (code, tools and verifier evidence,
# judged the same way in a feature cycle). check-feature runs in every feature phase.
  - id: check-feature-0
    kind: validator
    phase: 0
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 0
  - id: check-feature-1
    kind: validator
    phase: 1
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 1
  - id: check-feature-2
    kind: validator
    phase: 2
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 2
  - id: check-feature-3
    kind: validator
    phase: 3
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 3
  - id: check-feature-4
    kind: validator
    phase: 4
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 4
  - id: check-feature-5
    kind: validator
    phase: 5
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 5
  - id: check-feature-6
    kind: validator
    phase: 6
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 6
  - id: check-feature-6b
    kind: validator
    phase: 6b
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 6b
  - id: check-feature-7
    kind: validator
    phase: 7
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 7
  - id: check-feature-8
    kind: validator
    phase: 8
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 8
  - id: check-feature-9
    kind: validator
    phase: 9
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 9
  - id: check-feature-10a
    kind: validator
    phase: 10a
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 10a
  - id: check-feature-10b
    kind: validator
    phase: 10b
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 10b
  - id: check-feature-10c
    kind: validator
    phase: 10c
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 10c
  - id: check-feature-11
    kind: validator
    phase: 11
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 11
  - id: check-feature-11b
    kind: validator
    phase: 11b
    status: active
    scope: feature
    module: check_feature
    args:
      - --phase
      - 11b
# increment 6 (Amendment 2): onboarding. Phase B (Baseline) of a product INITialised on a
# repo that already has code: completeness and citations (every claim cites code that exists,
# path:line), the fresh-context baseline verifier's evidence, and the BMAD seam.
  - id: check-baseline
    kind: validator
    phase: B
    status: active
    module: check_baseline
  - id: check-verifiers-B
    kind: validator
    phase: B
    status: active
    module: check_verifiers
    args:
      - --phase
      - B
# increment 6 (item C): check-seam, the BMAD half (gate/config/bmad-adapter.yaml) and the
# path-map half, in the first phase of a product (0, or B when onboarded).
  - id: check-seam-0
    kind: validator
    phase: 0
    status: active
    module: check_seam
  - id: check-seam-B
    kind: validator
    phase: B
    status: active
    module: check_seam
