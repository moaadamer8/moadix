    scope: both
    kind: validator
    phase: 9
    status: active
    module: check_scanners
    args:
      - --tool
      - gitleaks
    timeout: 900
  - id: check-osv
    scope: both
    kind: validator
    phase: 9
    status: active
    module: check_scanners
