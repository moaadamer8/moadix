# harness/config/mypy.ini — type checking of the control layer.
#
# OPERATOR-OWNED and protected_always.
#
# Deliberately NOT --strict. The control layer is duck-typed YAML plumbing, and
# a strict run would demand hundreds of annotations whose only effect is to
# satisfy the checker. What is enabled is the subset that finds real mistakes:
# calls that cannot work, names that do not exist, containers whose element type
# was never established.
[mypy]
# increment 6: BMad core's scripts are vendored verbatim (Python 3.11+); check-seam checks them.
exclude = gate/bmad/
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unreachable = True
check_untyped_defs = False
