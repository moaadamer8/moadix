# MOADIX coverage topics (increment 7; docs/AMENDMENT-3.md sections 1-3). Installed root-owned with
# the gate. Read by gate/contract.py (coverage-lint, the size rule, the gap critic's brief) and by
# commands/coverage.md (generated from this file; tests/inc7 checks they agree).
#
#   phases.<label>.topics   every topic ID of the phase with its title. sdlc/<label>/COVERAGE.md
#                           lists each one with a section anchor or `N/A: <reason>`.
#   role                    the expertise the phase skill and the gap critic take on
#   blockers                phase-specific BLOCKER rules for the gap critic (added to `severity`)
#   gate                    the amendment's deterministic checks for the phase (what is built is
#                           listed under `built`; the rest is reported in docs/increment-7-report.md)
#   gated: false            phase 12 has no APPROVE in MOADIX (see the report: open conflict)
#   feature_topics          FC1-FC11, each assigned to the feature-cycle phase whose COVERAGE.md
#                           lists it
#   sizes                   the size rule (Amendment 3 section 2): topics N/A by default with their
#                           canned reason (`partial` names the part that is N/A; the topic itself
#                           still needs a section), and what each size turns on
version: 1
severity:
  BLOCKER: "a required topic missing or hollow; a contradiction with an upstream or frozen document; a missing security or privacy control; a claim that needs a citation and has none. An open BLOCKER refuses APPROVE and cannot be waived."
  MAJOR: "the topic is answered but not testable or not measurable. A MAJOR refuses APPROVE until the operator WAIVEs it with a reason."
  MINOR: "clarity. Written to a file for the operator; never shown in the APPROVE or REVIEW summary and never blocking."
