carry:
  # 0.7.0 (docs/critic-convergence-design.md): the hard rules every CARRY finding is held to. A gap that
  # matches no `defers` rule of its phase is judged at the current phase exactly as before 0.7.0
  # (BLOCKER, MAJOR or MINOR); `decides` wins every overlap.
  classes: ["security", "privacy", "tenant-isolation", "other"]
  protected: ["security", "privacy", "tenant-isolation"]
  protected_last_phase: "9"
  class_keywords:
    security: ["authentication", "authorization", "authz", "csrf", "xss", "injection", "password", "session token", "encryption", "rate limit", "brute force", "vulnerab"]
    privacy: ["personal data", "pii", "consent", "gdpr", "privacy", "data subject", "erasure"]
    tenant-isolation: ["tenant", "cross-tenant", "isolation"]
  carry_note_ratio: 0.5
feature_topics:
  blockers: "frozen-document change without a superseding ADR."
  topics:
    - id: FC1
      title: "feature brief vs frozen BRD"
      phase: "0"
    - id: FC2
      title: "impacted documents"
      phase: "0"
    - id: FC3
      title: "new AC IDs, never reused"
      phase: "2"
    - id: FC4
      title: "superseding ADRs for conflicts"
      phase: "3"
    - id: FC5
      title: "oasdiff result (breaking change needs ADR + deprecation plan)"
      phase: "5"
    - id: FC6
      title: "expand/contract migration"
      phase: "5"
    - id: FC7
      title: "threat-model delta"
      phase: "4"
    - id: FC8
      title: "regression impact"
      phase: "10b"
    - id: FC9
      title: "flag and rollout"
      phase: "11"
    - id: FC10
      title: "merge-back after release"
      phase: "11"
    - id: FC11
      title: "feature size class. Feature additions get the full product-document validators, not a lighter check"
      phase: "0"
sizes:
  S:
    profile: "at most about five entities, no payments, one locale, low risk"
    # 0.7.2 (design §10.5, ruling A4): size relaxes quantity bars only, never a legal, privacy, security,
    # tenant-isolation, citation, EARS or depth bar. The operator restores a full bar with turn_on.
    bars:
      - topic: R2
        bar: "2 to 3 real products"
        reason: "Size S: a small product is compared with 2 to 3 real products instead of 3 to 5."
      - topic: B13
        bar: "at least 2 competitors"
        reason: "Size S: the BRD names at least 2 competitors."
    na:
      - topic: B17
        partial: "the 100x growth path"
        reason: "Size S default: only the 10x growth path is needed; a 100x path is not planned for a product of at most about five entities, no payments and one locale."
      - topic: B24
        reason: "Size S default: a small, low-risk product has a single tenant, so there is no tenancy model to choose."
      - topic: H17
        reason: "Size S default: single tenant (B24 is N/A at size S), so there is no multi-tenancy isolation to design."
      - topic: H22
        reason: "Size S default: a formal ATAM pass is not repaid at size S; the H1 trade-offs are still recorded."
      - topic: H23
        reason: "Size S default: no native client is planned for a small product, so native-client readiness is not designed."
      - topic: T19
        reason: "Size S default: a small, low-risk product has no AI/LLM feature; if it has one, the operator turns T19 on."
      - topic: L20
        reason: "Size S default: a small product publishes no events or webhooks to third parties."
      - topic: L22
        partial: "the formal proof of each invariant"
        reason: "Size S default: critical invariants are still listed and tested; only formal proofs are N/A."
      - topic: U17
        reason: "Size S default: one theme; alternative themes are not repaid at size S."
      - topic: V13
        reason: "Size S default: the environment is small enough that the readiness check (V7) records it; a separate infrastructure record is not kept."
      - topic: TS10
        reason: "Size S default: mutation testing (Stryker) is not required at size S; line and branch coverage (TS11) still apply."
      - topic: CL3
        partial: "the soak test"
        reason: "Size S default: load, stress and spike tests still run; the soak test is N/A at size S."
      - topic: CL6
        reason: "Size S default: fault injection is required only at sizes M and L."
      - topic: RL3
        reason: "Size S default: an SBOM attachment and provenance are not required at size S; the phase-9 SBOM (SV11) still exists."
      - topic: RL7
        reason: "Size S default: a small product is rolled back as a whole (RL6); per-feature kill switches are not required."
      - topic: RL8
        reason: "Size S default: canary and blue-green releases are required only at size L."
      - phase: "11b"
        when: no-mobile
        reason: "Size S default with no mobile client in the platform ruling: there is no store release, so every phase-11b topic is N/A."
  M:
    profile: "multi-tenant or payments, RTL, public users"
    na:
      - topic: H23
        when: no-mobile
        reason: "Size M default with no mobile client in the platform ruling: native-client readiness is not designed."
      - topic: T19
        when: no-ai
        reason: "Size M default: no AI/LLM feature is declared; if the product has one, the operator turns T19 on."
      - topic: L22
        partial: "the formal proof of each invariant"
        reason: "Size M default: critical invariants are still listed and tested; only formal proofs are N/A."
      - topic: RL3
        partial: "the provenance attestation"
        reason: "Size M default: the SBOM is attached; SLSA provenance is required only at size L."
      - topic: RL8
        reason: "Size M default: canary and blue-green releases are required only at size L."
  L:
    profile: "regulated data, high scale, native apps"
    na: []
turned_on:
  S:
    - what: "ASVS L1"
      topic: T20
      check: mention
      arg: "(?i)\bL(?:evel\s*)?[123]\b"
    - what: "ZAP passive baseline"
      topic: SV7
      check: not_na
    - what: "timed restore drill"
      topic: RL13
      check: not_na
  M:
    - what: "ASVS L2"
      topic: T20
      check: mention
      arg: "(?i)\b(?:L|level\s*)[23]\b"
    - what: "pytm threat model as code"
      topic: T3
      check: mention
      arg: "(?i)\bpytm\b"
    - what: "Stryker mutation score of at least 70% on critical modules"
      topic: TS10
      check: min_percent
      arg: "70"
    - what: "Schemathesis contract tests"
      topic: TS8
      check: not_na
    - what: "soak test"
      topic: CL3
      check: mention
      arg: "(?i)\bsoak\b"
    - what: "Lighthouse CI assertions"
      topic: LV8
      check: not_na
  L:
    - what: "ASVS L2 or L3"
      topic: T20
      check: mention
      arg: "(?i)\b(?:L|level\s*)[23]\b"
    - what: "PASTA threat analysis"
      topic: T3
      check: mention
      arg: "(?i)\bPASTA\b"
    - what: "one or two formal invariants"
      topic: L22
      check: mention
      arg: "(?i)\bformal\b"
    - what: "Stryker mutation score of at least 80%"
      topic: TS10
      check: min_percent
      arg: "80"
    - what: "fault injection"
      topic: CL6
      check: not_na
    - what: "canary or blue-green release"
      topic: RL8
      check: not_na
    - what: "SLSA provenance"
      topic: RL3
      check: mention
      arg: "(?i)\b(SLSA|provenance)\b"
    - what: "full phase 11b"
      topic: SR1
      check: not_na
