        - id: D0.1
          what: "a business promise to a customer or partner"
          keywords: ["guarantee", "guaranteed", "we promise", "money-back", "warranty"]
        - id: D0.2
          what: "a role's permissions (who may do what, in business terms)"
          keywords: ["who may", "is allowed to", "is not allowed to", "must not be able to", "permission"]
        - id: D0.3
          what: "a money flow (who pays whom and when, refunds, chargebacks, payouts, commission, tax)"
          keywords: ["refund policy", "payout", "chargeback", "commission", "who pays", "vat", "sales tax", "pricing model"]
        - id: D0.4
          what: "a legal or privacy duty (the named regime and what it requires of the business)"
          keywords: ["gdpr", "ccpa", "pci dss", "lawful basis", "consent", "data protection", "regulation"]
        - id: D0.5
          what: "data ownership and the retention policy"
          keywords: ["retention policy", "data owner", "owns the data", "kept for", "deleted after"]
        - id: D0.6
          what: "release scope (each feature in, later or rejected)"
          keywords: ["out of scope", "in scope", "later release", "rejected", "mvp"]
        - id: D0.7
          what: "the existence of a lifecycle state"
          keywords: ["lifecycle state", "new state", "state machine"]
        - id: D0.B
          what: "the phase's BLOCKER rules: a missing money flow or legal regime, generic personas, invented statistics, everything rated Must"
          keywords: ["money flow", "legal regime", "generic persona", "statistic"]
      defers:
        - id: X0.1
          what: "behaviour detail one story's acceptance criteria can settle (field lists, sorting, exact wording, exact table rows)"
          to: "2"
        - id: X0.2
          what: "attack defences and abuse limits beyond the business rule"
          to: "4"
        - id: X0.3
          what: "schema and API detail, including the mechanics of retention per record type"
          to: "5"
        - id: X0.4
          what: "screen layout and copy"
          to: "6"
    blockers: "missing money flow or legal regime; attacks generic personas, invented statistics, everything rated Must."
